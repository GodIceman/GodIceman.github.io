    * { box-sizing:border-box; }
    body { margin:0; font-family:"Microsoft YaHei", Arial, sans-serif; color:var(--ink); background:var(--paper); }

    h1 { margin:0 0 8px; font-size:34px; letter-spacing:-1px; }
    .sub { color:var(--muted); max-width:860px; line-height:1.6; }
    .warning { margin-top:16px; display:inline-block; padding:7px 10px; background:#fff1d9; color:#82531d; font-size:13px; }
    main { padding:26px 6vw 56px; }
    .controls { display:flex; gap:14px; flex-wrap:wrap; margin-bottom:22px; align-items:end; }
    label { font-size:13px; color:var(--muted); display:grid; gap:6px; }
    input, select { min-width:180px; padding:10px 12px; border:1px solid #c8c3b8; border-radius:6px; background:white; font:inherit; }
    input:focus, select:focus { outline:3px solid rgba(14,107,120,.15); border-color:var(--accent); }
    .table-headline { display:flex; justify-content:space-between; gap:16px; align-items:center; margin:0 2px 10px; color:var(--muted); font-size:13px; }
    .table-headline strong { color:var(--ink); }
    .table-wrap { overflow-x:auto; border-radius:10px; box-shadow:0 8px 26px rgba(35,42,45,.06); }
    table { width:100%; border-collapse:collapse; background:white; }
    th, td { text-align:left; padding:13px 12px; border-bottom:1px solid #eee9e0; vertical-align:top; }
    th { font-size:12px; color:var(--muted); letter-spacing:.4px; text-transform:uppercase; position:sticky; top:0; background:#fbfaf7; }
    td { font-size:14px; }
    .report-row { cursor:pointer; transition:background .15s ease, transform .15s ease; }
    .report-row:hover, .report-row:focus { background:#f1f8f8; outline:none; }
    .report-row:focus { box-shadow:inset 4px 0 0 var(--accent); }
    .score { font-size:22px; font-weight:700; color:var(--accent); }
    .prob { color:var(--warm); font-weight:700; }
    .reason { max-width:280px; line-height:1.5; }
    .meta { color:var(--muted); font-size:12px; margin-top:5px; }
    .open-detail { display:inline-flex; align-items:center; gap:4px; margin-top:7px; color:var(--accent); font-size:12px; font-weight:700; }
    .empty { padding:28px; text-align:center; color:var(--muted); }
    dialog { width:min(760px, calc(100vw - 32px)); max-height:calc(100vh - 40px); padding:0; border:0; border-radius:16px; color:var(--ink); background:#fbfaf7; box-shadow:0 24px 80px rgba(16,33,43,.3); }
    dialog::backdrop { background:rgba(11,24,31,.6); backdrop-filter:blur(3px); }
    .detail-shell { padding:30px; }
    .close { position:absolute; top:15px; right:17px; width:38px; height:38px; border:0; border-radius:50%; background:#ede9e1; color:var(--ink); font-size:24px; cursor:pointer; }
    .close:hover, .close:focus { background:#dfecee; outline:3px solid rgba(14,107,120,.15); }
    .eyebrow { color:var(--accent); font-size:12px; font-weight:700; letter-spacing:.8px; text-transform:uppercase; }
    .detail-title { margin:7px 48px 5px 0; font-size:25px; line-height:1.3; }
    .detail-meta { color:var(--muted); font-size:13px; }
    .priority { display:inline-block; margin-top:14px; padding:7px 10px; border-radius:999px; background:var(--accent-soft); color:var(--accent); font-size:13px; font-weight:700; }
    .metric-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:20px 0; }
    .metric { padding:15px; border:1px solid var(--line); border-radius:10px; background:white; }
    .metric span { display:block; color:var(--muted); font-size:12px; line-height:1.35; }
    .metric strong { display:block; margin-top:5px; font-size:22px; }
    .detail-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .detail-card { padding:17px; border:1px solid var(--line); border-radius:10px; background:white; }
    .detail-card.full { grid-column:1 / -1; }
    .detail-card h3 { margin:0 0 9px; font-size:14px; }
    .detail-card p { margin:0; color:#354952; line-height:1.65; }
    .tags { display:flex; flex-wrap:wrap; gap:7px; }
    .tag { padding:6px 9px; border-radius:999px; background:#eef2f1; color:#39545b; font-size:12px; }

  <dialog id="report-modal" aria-labelledby="detail-title">

    function render(){
      const q = document.getElementById('query').value.trim().toLowerCase();
      const industry = document.getElementById('industry').value;
      const floor = Number(document.getElementById('score').value || 0);
      const filtered = data.filter(d => (!q || `${d.company_name}${d.title}${d.symbol}`.toLowerCase().includes(q)) && (!industry || d.industry===industry) && d.attention_score>=floor);
      document.getElementById('result-count').innerHTML = `当前显示 <strong>${filtered.length}</strong> / ${data.length} 篇研报`;
      rows.innerHTML = filtered.length ? filtered.map(d => `<tr class="report-row" data-report-id="${esc(d.report_id)}" tabindex="0" role="button" aria-label="查看${esc(d.company_name)}研报详情">
        <td><div class="score">${d.attention_score.toFixed(1)}</div><div class="meta">${d.entry_date}</div></td>
        <td><strong>${esc(d.company_name)}</strong> ${esc(d.symbol)}<div>${esc(d.title)}</div><div class="meta">${esc(d.broker)} · ${esc(d.industry)}</div><span class="open-detail">查看AI分析详情 →</span></td>
        <td class="prob">${fmtPct(d.positive_probability)}</td>
        <td class="reason">${esc(d.reason_codes)}<div class="meta">重点：${esc(d.key_catalyst || '未提取')}<br>可跳过：${esc(d.ignore_sections || '无')}</div></td>
        <td class="optional">${fmtPct(d.predicted_excess_return)} / ${fmtPct(d.excess_return_20d)}</td>
      </tr>`).join('') : `<tr><td colspan="5" class="empty">没有满足当前筛选条件的研报</td></tr>`;
    }
    function openReport(reportId){
      const d = data.find(item => item.report_id === reportId);
      if (!d) return;
      const reasons = String(d.reason_codes || '未提取').split('；').filter(Boolean);
      const skip = String(d.ignore_sections || '无').split('|').filter(Boolean);
      detailContent.innerHTML = `<article class="detail-shell">
        <div class="eyebrow">AI研报价值判断 · ${esc(d.report_id)}</div>
        <h2 class="detail-title" id="detail-title">${esc(d.title)}</h2>
        <div class="detail-meta">${esc(d.company_name)} ${esc(d.symbol)} · ${esc(d.broker)} · ${esc(d.industry)} · ${esc(d.entry_date)}</div>
        <div class="priority">${priorityLabel(d.attention_score)}</div>
        <div class="metric-grid">
          <div class="metric"><span>综合关注分</span><strong>${d.attention_score.toFixed(1)}</strong></div>
          <div class="metric"><span>未来20日正超额概率</span><strong>${fmtPct(d.positive_probability)}</strong></div>
          <div class="metric"><span>模型预测超额</span><strong>${fmtPct(d.predicted_excess_return)}</strong></div>
        </div>
        <div class="detail-grid">
          <section class="detail-card full"><h3>AI结构化摘要</h3><p>${esc(d.summary || '暂无摘要')}</p></section>
          <section class="detail-card"><h3>建议重点关注</h3><p>${esc(d.key_catalyst || '暂未提取到明确催化剂')}</p></section>
          <section class="detail-card"><h3>可降低阅读优先级</h3><p class="skip-list">${skip.map(item => esc(item)).join('、')}</p></section>
          <section class="detail-card full"><h3>进入重点队列的原因</h3><div class="tags">${reasons.map(item => `<span class="tag">${esc(item)}</span>`).join('')}</div></section>
        </div>
        <div class="method-note">历史验证结果：未来20日行业中性超额为 <strong>${fmtPct(d.excess_return_20d)}</strong>。该字段只用于历史回测验收，不参与新研报当天的模型打分。</div>
      </article>`;
      if (typeof modal.showModal === 'function') modal.showModal(); else modal.setAttribute('open', '');
      document.body.style.overflow = 'hidden';
    }
    function closeReport(){
      if (typeof modal.close === 'function') modal.close(); else modal.removeAttribute('open');
      document.body.style.overflow = '';
    }

    modal.addEventListener('close', () => { document.body.style.overflow = ''; });
  </script>
</body>
</html>
